{% extends "base.html" %}
{% block title %}发照片{% endblock %}

{% block content %}
<div class="form-page">
  <h1>发照片</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/new" enctype="multipart/form-data">
    <label>选择图片
      <input type="file" name="file" accept="image/*" required>
    </label>
    <label>文案
      <textarea name="caption" rows="4" placeholder="说点什么…"></textarea>
    </label>
    <button type="submit" class="btn btn-primary btn-block">发布</button>
  </form>
  <p class="hint">支持 JPG / PNG / GIF / WebP，单张不超过 10 MB</p>
</div>
{% endblock %}
