{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="form-page">
  <h1>注册</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>用户名<input type="text" name="username" required autofocus></label>
    <label>密码（至少 6 位）<input type="password" name="password" required></label>
    <button type="submit" class="btn btn-primary btn-block">注册并登录</button>
  </form>
  <p class="hint">已有账号？<a href="/login">去登录</a></p>
</div>
{% endblock %}
